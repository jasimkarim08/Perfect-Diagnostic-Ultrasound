<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 65" width="560" height="65" fill="none">
  <!-- Concept 1: Clean Baseline Under All Inline Text -> Wavelet Spike at End -->
  <!-- Left Probe Acoustic Arc Cluster -->
  <g transform="translate(6, 4)">
    <path d="M8 18 A 16 16 0 0 1 8 38" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 12 A 24 24 0 0 1 15 44" stroke="#02424E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M22 6 A 32 32 0 0 1 22 50" stroke="#5E9297" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Inline Typography: PERFECT DIAGNOSTIC ULTRASOUND -->
  <text x="42" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#02424E" letter-spacing="1.2">PERFECT</text>
  <text x="160" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" font-weight="800" fill="#055E6E" letter-spacing="3.2">DIAGNOSTIC ULTRASOUND</text>

  <!-- Signal Line: Flat Beginning Part Running Directly Under All Text, Then Doppler Pulse Spike -->
  <!-- Flat beginning under text: from x=42 to x=430 at y=43 -->
  <!-- Pulse spike: from x=430 to x=465 -->
  <!-- Flat ending tail: from x=465 to x=540 at y=43 -->
  <path d="M 42 43 L 430 43 L 436 29 L 442 55 L 448 35 L 453 47 L 458 43 L 542 43" stroke="#0A808C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="542" cy="43" r="3" fill="#02424E"/>
  <circle cx="42" cy="43" r="2" fill="#0A808C"/>
</svg>