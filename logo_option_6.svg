<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70" width="420" height="70" fill="none">
  <!-- Dynamic Acoustic Soundwaves Left Crest -->
  <g transform="translate(6, 4)">
    <path d="M12 20 A 18 18 0 0 1 12 42" stroke="#0A808C" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M18 14 A 26 26 0 0 1 18 48" stroke="#02424E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M24 9 A 34 34 0 0 1 24 53" stroke="#5E9297" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Word: PERFECT with Letter 'P' integrated into ultrasound beam -->
  <text x="44" y="37" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#02424E" letter-spacing="1">PERFECT</text>
  
  <!-- Waveform Doppler Pulse Line integrated directly under PERFECT -->
  <path d="M188 30 L 200 30 L 204 18 L 210 44 L 216 24 L 220 34 L 226 30 L 410 30" stroke="#0A808C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- DIAGNOSTIC ULTRASOUND enclosed between dual precision caliper markers -->
  <line x1="44" y1="46" x2="44" y2="60" stroke="#055E6E" stroke-width="2"/>
  <line x1="44" y1="53" x2="48" y2="53" stroke="#055E6E" stroke-width="2"/>
  <text x="54" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#055E6E" letter-spacing="4.5">DIAGNOSTIC ULTRASOUND</text>
  <line x1="406" y1="53" x2="410" y2="53" stroke="#055E6E" stroke-width="2"/>
  <line x1="410" y1="46" x2="410" y2="60" stroke="#055E6E" stroke-width="2"/>
</svg>
