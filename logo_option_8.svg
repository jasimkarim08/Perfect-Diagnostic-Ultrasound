<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70" width="420" height="70" fill="none">
  <!-- Interlocking Monogram 'PD' with Acoustic Shield -->
  <g transform="translate(6, 5)">
    <!-- Hexagonal Medical Shield Background -->
    <path d="M26 2 L48 12 L48 38 C48 50, 26 58, 26 58 C26 58, 4 50, 4 38 L4 12 Z" fill="#02424E"/>
    
    <!-- Inner Concentric Ultrasound Wave Lines -->
    <path d="M12 20 C18 16, 34 16, 40 20" stroke="#0A808C" stroke-width="2.2" stroke-linecap="round" fill="none"/>
    <path d="M15 28 C20 24, 32 24, 37 28" stroke="#5E9297" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Interlocked Monogram P + D in White -->
    <text x="26" y="46" text-anchor="middle" font-family="'Outfit', sans-serif" font-size="23" font-weight="900" fill="#FFFFFF" letter-spacing="-1">PD</text>

    <!-- Mini Pulse Heartbeat Line -->
    <path d="M17 50 L23 50 L25 46 L27 53 L29 48 L31 50 L35 50" stroke="#0A808C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Integrated Text Lockup connected directly to the crest -->
  <text x="64" y="33" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="23" font-weight="900" fill="#02424E" letter-spacing="1.2">PERFECT DIAGNOSTIC</text>

  <!-- Accent Divider Line with Pulse Dot -->
  <line x1="64" y1="41" x2="384" y2="41" stroke="#0A808C" stroke-width="2"/>
  <circle cx="392" cy="41" r="3.5" fill="#02424E"/>

  <text x="64" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#055E6E" letter-spacing="5.8">ULTRASOUND</text>
</svg>
