<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 70" width="440" height="70" fill="none">
  <!-- Option 6B Variation 2: Centered Subtitle (Clean - No T-Calipers) -->
  <!-- Left Probe Acoustic Arc Cluster -->
  <g transform="translate(6, 4)">
    <path d="M8 22 A 16 16 0 0 1 8 42" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 15 A 24 24 0 0 1 15 49" stroke="#02424E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M22 9 A 32 32 0 0 1 22 55" stroke="#5E9297" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Wordmark: PERFECT -->
  <text x="42" y="35" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="27" font-weight="900" fill="#02424E" letter-spacing="1.5">PERFECT</text>

  <!-- Right Side Accent: Pulse Rhythm Wavelet -->
  <path d="M184 28 L 250 28 L 255 16 L 261 41 L 267 22 L 272 32 L 277 28 L 428 28" stroke="#0A808C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="428" cy="28" r="3" fill="#02424E"/>

  <!-- Sleek Precision Divider Line with Left-Right Anchor Accents -->
  <line x1="42" y1="43" x2="428" y2="43" stroke="#CBDCE0" stroke-width="1.8"/>
  <circle cx="42" cy="43" r="2" fill="#0A808C"/>
  <circle cx="428" cy="43" r="2" fill="#0A808C"/>

  <!-- Subtitle: DIAGNOSTIC ULTRASOUND (Centered Under Divider) -->
  <text x="235" y="58" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#055E6E" letter-spacing="6.2">DIAGNOSTIC ULTRASOUND</text>
</svg>
