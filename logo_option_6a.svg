<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 70" width="440" height="70" fill="none">
  <!-- Option 6A: Seamless Pulse Bridge & Transducer Sonar Crest -->
  <!-- Left Transducer Probe & Radiating Acoustic Sonar Arcs -->
  <g transform="translate(6, 6)">
    <!-- Micro Transducer Probe Head -->
    <rect x="0" y="20" width="8" height="18" rx="2.5" fill="#02424E"/>
    <path d="M8 23 C11 23, 13 25, 13 29 C13 33, 11 35, 8 35 Z" fill="#0A808C"/>
    
    <!-- Concentric Ultrasound Beams -->
    <path d="M17 19 A 16 16 0 0 1 17 39" stroke="#0A808C" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M23 13 A 24 24 0 0 1 23 45" stroke="#02424E" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M29 8 A 32 32 0 0 1 29 50" stroke="#5E9297" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Typography: PERFECT -->
  <text x="48" y="37" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#02424E" letter-spacing="1">PERFECT</text>

  <!-- Seamless Doppler Pulse Wave extending across upper baseline -->
  <path d="M192 30 L 210 30 L 215 17 L 221 44 L 227 23 L 232 34 L 237 30 L 416 30" stroke="#0A808C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Caliper Endpoint Coordinate Ring -->
  <circle cx="422" cy="30" r="3.5" fill="#0A808C"/>
  <circle cx="422" cy="30" r="1.5" fill="#FFFFFF"/>

  <!-- Subtitle: DIAGNOSTIC ULTRASOUND with Dual Precision Crosshair Calipers -->
  <!-- Left Caliper Crosshair Marker -->
  <path d="M48 46 L48 60 M44 53 L52 53" stroke="#055E6E" stroke-width="2" stroke-linecap="round"/>
  
  <text x="58" y="57" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#055E6E" letter-spacing="4.8">DIAGNOSTIC ULTRASOUND</text>
  
  <!-- Right Caliper Crosshair Marker -->
  <path d="M422 46 L422 60 M418 53 L426 53" stroke="#055E6E" stroke-width="2" stroke-linecap="round"/>
</svg>
