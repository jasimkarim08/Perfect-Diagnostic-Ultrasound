<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 62" width="540" height="62" fill="none">
  <!-- Concept 4: Dual Tone Signal Line with High Contrast Medical Accent -->
  <g transform="translate(6, 4)">
    <path d="M8 17 A 15 15 0 0 1 8 37" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 11 A 23 23 0 0 1 15 43" stroke="#02424E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M22 5 A 31 31 0 0 1 22 49" stroke="#5E9297" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- All text inline on top of flat line -->
  <text x="42" y="32" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="23" font-weight="900" fill="#02424E" letter-spacing="1.2">PERFECT</text>
  <text x="154" y="32" font-family="'Plus Jakarta Sans', sans-serif" font-size="13.5" font-weight="800" fill="#02424E" letter-spacing="3.2">DIAGNOSTIC ULTRASOUND</text>

  <!-- Flat base line in precision clinical tint -->
  <line x1="42" y1="41" x2="415" y2="41" stroke="#0A808C" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Pulse spike & trailing tail -->
  <path d="M 415 41 L 421 26 L 427 52 L 434 32 L 439 45 L 444 41 L 525 41" stroke="#0A808C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="525" cy="41" r="3" fill="#02424E"/>
  <circle cx="42" cy="41" r="2" fill="#02424E"/>
</svg>