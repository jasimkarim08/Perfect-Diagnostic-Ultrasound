<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 70" width="420" height="70" fill="none">
  <!-- Acoustic Sector Framing Fan (Left & Top Ultrasound Beam Arc) -->
  <g transform="translate(6, 6)">
    <!-- Ultrasound Probe Apex -->
    <path d="M6 14 C6 8, 14 4, 22 4 C30 4, 38 8, 38 14 L34 26 C34 28, 10 28, 10 26 Z" fill="#02424E"/>
    <circle cx="22" cy="14" r="4" fill="#0A808C"/>
    <!-- Expanding Scanning Sound Beams Framing The Left -->
    <path d="M10 28 L2 56" stroke="#0A808C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M34 28 L42 56" stroke="#0A808C" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M6 52 A 30 30 0 0 0 38 52" stroke="#02424E" stroke-width="3" stroke-linecap="round"/>
    <path d="M11 44 A 20 20 0 0 0 33 44" stroke="#5E9297" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Connected Frame Bracket embracing the text -->
  <path d="M52 14 L 408 14 L 414 20 L 414 54 L 408 60 L 52 60" stroke="#02424E" stroke-width="1.5" stroke-dasharray="380 40" fill="none" opacity="0.3"/>

  <!-- Core Headline Wordmark -->
  <text x="56" y="36" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="24" font-weight="900" fill="#02424E" letter-spacing="1.2">PERFECT DIAGNOSTIC</text>

  <!-- Subtitle Bar Integrated in Cyan Contrast Box -->
  <rect x="56" y="44" width="344" height="18" rx="4" fill="#055E6E"/>
  <text x="228" y="57" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="4">ULTRASOUND CLINIC</text>
  
  <!-- Right Corner Cross Accent -->
  <path d="M400 32 L400 40 M396 36 L404 36" stroke="#0A808C" stroke-width="2.2" stroke-linecap="round"/>
</svg>
