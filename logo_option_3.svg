<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 370 60" width="370" height="60" fill="none">
  <!-- Geometric Transducer & Sonography Beam Icon -->
  <g transform="translate(6, 7)">
    <!-- Ultrasonic Sound Field (Tri-Frequency Waves) -->
    <path d="M6 13 C 2 19 2 27 6 33" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <path d="M12 8 C 7 17 7 29 12 38" stroke="#5E9297" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M18 3 C 12 15 12 31 18 43" stroke="#6F9EA3" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Probe -->
    <path d="M24 12 L35 8 L35 38 L24 34 Z" fill="#02424E"/>
    <path d="M35 15 L46 15 L46 31 L35 31 Z" fill="#065969" rx="2"/>
    <line x1="24" y1="13" x2="24" y2="33" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <!-- Pulse Wave inside Handle -->
    <path d="M37 23 L40 23 L41 18 L43 28 L44 23 L46 23" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: Crisp, Balanced, High Readability -->
  <text x="64" y="26" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="800" fill="#02424E" letter-spacing="0.5">PERFECT</text>
  <text x="156" y="26" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="19" font-weight="600" fill="#055E6E" letter-spacing="0.5">DIAGNOSTIC</text>
  <text x="64" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#0A808C" letter-spacing="5.2">ULTRASOUND</text>
</svg>