  "Systematic evaluation of posterior tibial, peroneal, and gastrocnemius veins for isolated calf vein thrombosis.": "Evaluación sistemática de las venas tibial posterior, peronea y gastrocnemio para detectar trombosis aislada de la vena de la pantorrilla.",
  "Evaluates regional axillary lymph node architecture, cortical thickness, and fatty hila when clinically indicated.": "Evalúa la arquitectura de los ganglios linfáticos axilares regionales, el espesor cortical y los hilios grasos cuando está clínicamente indicado.",
  "High-resolution ultrasound imaging of superficial structures including thyroid gland, neck structures, and testes.": "Imágenes por ultrasonido de alta resolución de estructuras superficiales que incluyen la glándula tiroides, las estructuras del cuello y los testículos.",
  "Inspection of the cul-de-sac for free fluid, pelvic inflammatory disease (PID) sequelae, or ruptured ovarian cysts.": "Inspección del callejón sin salida en busca de líquido libre, secuelas de enfermedad inflamatoria pélvica (EPI) o quistes ováricos rotos.",
  "Non-invasive assessment of prostate gland volume, architecture, median lobe protrusion, and urinary outflow dynamics.": "Evaluación no invasiva del volumen, la arquitectura, la protrusión del lóbulo mediano y la dinámica del flujo urinario de la próstata.",
  "Our clinic operates strictly by appointment only to ensure minimal waiting times and dedicated one-on-one patient care.": "Nuestra clínica opera estrictamente con cita previa para garantizar tiempos de espera mínimos y una atención personalizada y dedicada al paciente.",
  "Differentiates homogeneous, heterogeneous, calcified, soft, or ulcerated plaques along the carotid bulb and bifurcation.": "Diferencia placas homogéneas, heterogéneas, calcificadas, blandas o ulceradas a lo largo del bulbo carotídeo y la bifurcación.",
  "Standard turnaround is 24 to 48 business hours. Final signed reports are faxed directly back to your clinical fax number.": "El plazo de entrega estándar es de 24 a 48 horas hábiles. Los informes finales firmados se envían por fax directamente a su número de fax clínico.",
  "or hand it to the patient. We accept orders for all abdominal, pelvic, OB, vascular, cardiac, and small parts modalities.": "o entregárselo al paciente. Aceptamos pedidos para todas las modalidades abdominales, pélvicas, obstétricas, vasculares, cardíacas y de piezas pequeñas.",
  "A frictionless coordination process designed to make ultrasound scheduling effortless for your medical staff and patients.": "Un proceso de coordinación sin fricciones diseñado para que la programación de ultrasonidos sea sencilla para su personal médico y sus pacientes.",
  "Examines kidney size, parenchymal thickness, renal calculi (stones), hydronephrosis, and post-void residual bladder volume.": "Examina el tamaño del riñón, el espesor del parénquima, los cálculos renales (piedras), la hidronefrosis y el volumen residual de la vejiga posmiccional.",
  "Non-invasive breast imaging for evaluation of breast tissue, cysts, and lumps, providing targeted anatomical visualization.": "Imágenes mamarias no invasivas para la evaluación del tejido mamario, quistes y bultos, proporcionando visualización anatómica específica.",
  "Healthcare is personal. We are proud to serve Chicago’s diverse communities with a warm, welcoming multilingual medical team.": "La atención sanitaria es personal. Estamos orgullosos de servir a las diversas comunidades de Chicago con un equipo médico multilingüe cálido y acogedor.",
  "We only work with appointments. Inquiries and scheduling assistance are welcomed daily. Convenient on-site parking available.": "Sólo trabajamos con citas. Se aceptan consultas y asistencia con la programación todos los días. Conveniente estacionamiento en el lugar disponible.",
  "Focused imaging for right upper quadrant pain, gallbladder stones, pancreatitis, or abdominal aortic aneurysm (AAA) screening.": "Imágenes enfocadas para detectar dolor en el cuadrante superior derecho, cálculos en la vesícula biliar, pancreatitis o detección de aneurisma aórtico abdominal (AAA).",
  "Evaluation of anterior and lateral cervical lymph nodes to differentiate benign reactive lymphadenopathy from suspicious nodes.": "Evaluación de los ganglios linfáticos cervicales anteriores y laterales para diferenciar la linfadenopatía reactiva benigna de los ganglios sospechosos.",
  "Examines common and internal carotid arteries for atherosclerotic plaque buildup, stenosis severity, and stroke risk screening.": "Examina las arterias carótidas interna y común en busca de acumulación de placa aterosclerótica, gravedad de la estenosis y detección del riesgo de accidente cerebrovascular.",
  "Provide your signed prescription pad or order form to the patient. Patients can schedule their appointment online or by calling": "Proporcione al paciente su recetario firmado o formulario de pedido. Los pacientes pueden programar su cita en línea o llamando",
  "Evaluates bladder neck anatomy and assesses whether median lobe enlargement is contributing to urinary hesitancy or weak stream.": "Evalúa la anatomía del cuello de la vejiga y valora si el agrandamiento del lóbulo mediano contribuye a la vacilación o al flujo débil de la orina.",
  "Non-invasive transabdominal ultrasound evaluating prostate gland volume, median lobe architecture, and bladder outflow dynamics.": "Ultrasonido transabdominal no invasivo que evalúa el volumen de la glándula prostática, la arquitectura del lóbulo mediano y la dinámica del flujo de salida de la vejiga.",
  "Transmit orders, clinical indications, or insurance authorizations via email. We confirm receipt promptly during business hours.": "Transmitir órdenes, indicaciones clínicas o autorizaciones de seguros vía correo electrónico. Confirmamos la recepción con prontitud durante el horario comercial.",
  "Non-invasive pregnancy imaging to monitor fetal development, viability, and gestational age, with 2D, 3D, and 4D imaging options.": "Imágenes del embarazo no invasivas para monitorear el desarrollo fetal, la viabilidad y la edad gestacional, con opciones de imágenes 2D, 3D y 4D.",
  "Schedule your diagnostic ultrasound appointment with our experienced clinical team today. Operating strictly by appointment only.": "Programe hoy su cita de ultrasonido de diagnóstico con nuestro experimentado equipo clínico. Operando estrictamente solo con cita previa.",
  "Accurately measures splenic bipolar length to assess for splenomegaly, splenic cysts, infarctions, or architectural abnormalities.": "Mide con precisión la longitud bipolar esplénica para evaluar si hay esplenomegalia, quistes esplénicos, infartos o anomalías arquitectónicas.",
  "Detailed survey of fetal organs, cranial anatomy, spine, extremities, placental localization, and optional elective 3D/4D imaging.": "Estudio detallado de los órganos fetales, anatomía craneal, columna vertebral, extremidades, localización placentaria e imágenes 3D/4D electivas opcionales.",
  "Determines post-micturition bladder retention volume to evaluate the functional impact of prostate enlargement on bladder emptying.": "Determina el volumen de retención de la vejiga después de la micción para evaluar el impacto funcional del agrandamiento de la próstata en el vaciado de la vejiga.",
  "High-frequency internal assessment providing magnified resolution of the endometrial stripe, small ovarian cysts, PCOS, and adnexa.": "Evaluación interna de alta frecuencia que proporciona una resolución ampliada de la franja endometrial, pequeños quistes ováricos, síndrome de ovario poliquístico y sus anexos.",
  "High-resolution sonographic evaluation of renal parenchyma, calculi, hydronephrosis, and urinary bladder post-void residual volume.": "Evaluación ecográfica de alta resolución del parénquima renal, cálculos, hidronefrosis y volumen residual posmiccional de la vejiga urinaria.",
  "Confirmation of intrauterine pregnancy, early cardiac activity, accurate gestational dating via CRL, and maternal pelvic assessment.": "Confirmación de embarazo intrauterino, actividad cardíaca temprana, datación gestacional precisa mediante CRL y evaluación pélvica materna.",
  "Tailored health consultations and individualized care plans, accommodating patients even if they do not have a prior doctor's order.": "Consultas de salud personalizadas y planes de atención individualizados, atendiendo a los pacientes incluso si no tienen orden médica previa.",
  "Targeted, patient-guided imaging directly over areas of palpable concern, skin dimpling, focal breast pain, or localized tenderness.": "Imágenes dirigidas y guiadas por el paciente directamente sobre áreas de preocupación palpables, hoyuelos en la piel, dolor mamario focal o sensibilidad localizada.",
  "Fetal growth tracking, fetal position/presentation, estimated fetal weight (EFW), biophysical profile (BPP), and amniotic fluid volume.": "Seguimiento del crecimiento fetal, posición/presentación fetal, peso fetal estimado (EFW), perfil biofísico (BPP) y volumen de líquido amniótico.",
  "High-resolution superficial sonography of the thyroid gland (TI-RADS scoring), cervical lymph nodes, and scrotal/testicular structures.": "Ecografía superficial de alta resolución de la glándula tiroides (puntuación TI-RADS), ganglios linfáticos cervicales y estructuras escrotales/testiculares.",
  "Venous duplex examination to assess for deep vein thrombosis (DVT), acute clot formation, and chronic venous insufficiency in the legs.": "Examen venoso dúplex para evaluar la trombosis venosa profunda (TVP), la formación de coágulos agudos y la insuficiencia venosa crónica en las piernas.",
  "Have questions about an ultrasound scan, physician orders, or insurance? Reach out to our team directly or send an online message below.": "¿Tiene preguntas sobre una ecografía, órdenes médicas o seguros? Comuníquese con nuestro equipo directamente o envíe un mensaje en línea a continuación.",
  "Provides supplemental high-contrast imaging in patients with dense breast tissue where standard mammographic sensitivity may be reduced.": "Proporciona imágenes complementarias de alto contraste en pacientes con tejido mamario denso donde la sensibilidad mamográfica estándar puede verse reducida.",
  "Targeted, radiation-free evaluation of palpable lumps, focal tenderness, dense breast tissue, and cyst vs solid nodule characterization.": "Evaluación dirigida y sin radiación de bultos palpables, dolor focal, tejido mamario denso y caracterización de quistes versus nódulos sólidos.",
  "Over two and a half decades of dedicated clinical expertise providing diagnostic ultrasound imaging across the Chicago metropolitan area.": "Más de dos décadas y media de experiencia clínica dedicada al suministro de imágenes de ultrasonido de diagnóstico en toda el área metropolitana de Chicago.",
  "Doppler studies evaluating blood flow in arteries and veins, including carotid artery evaluation and lower extremity vascular circulation.": "Estudios Doppler que evalúan el flujo sanguíneo en arterias y venas, incluida la evaluación de la arteria carótida y la circulación vascular de las extremidades inferiores.",
  "Evaluation of internal organs including the liver, gallbladder, pancreas, spleen, kidneys, and abdominal aorta to assess symptoms or pain.": "Evaluación de órganos internos, incluidos el hígado, la vesícula biliar, el páncreas, el bazo, los riñones y la aorta abdominal para evaluar los síntomas o el dolor.",
  "Specialized hemodynamic Doppler assessment evaluating peripheral arterial blood flow, claudication, and peripheral arterial disease (PAD).": "Evaluación Doppler hemodinámica especializada que evalúa el flujo sanguíneo arterial periférico, la claudicación y la enfermedad arterial periférica (EAP).",
  "Thorough assessment of the liver, gallbladder, common bile duct, pancreas, spleen, kidneys, and abdominal aorta for pain or abnormal LFTs.": "Evaluación exhaustiva del hígado, la vesícula biliar, el colédoco, el páncreas, el bazo, los riñones y la aorta abdominal para detectar dolor o LFT anormales.",
  "Calculates left and right ventricular systolic function, stroke volume, myocardial wall motion, and overall cardiac ejection fraction (EF).": "Calcula la función sistólica de los ventrículos izquierdo y derecho, el volumen sistólico, el movimiento de la pared del miocardio y la fracción de eyección cardíaca (FE) general.",
  "Our clinical provider desk is available to assist referring practices with order confirmations, modality inquiries, and patient scheduling.": "Nuestro mostrador de proveedores clínicos está disponible para ayudar a los consultorios remitentes con confirmaciones de pedidos, consultas sobre modalidades y programación de pacientes.",
  "Arterial Doppler evaluating peripheral arterial disease (PAD), intermittent claudication, arterial pulse waveforms, and vascular resistance.": "Doppler arterial que evalúa la enfermedad arterial periférica (EAP), la claudicación intermitente, las formas de onda del pulso arterial y la resistencia vascular.",
  "Assesses spontaneous flow, respiratory phasicity, and response to distal augmentation maneuvers to rule out proximal pelvic vein obstruction.": "Evalúa el flujo espontáneo, la fasicidad respiratoria y la respuesta a las maniobras de aumento distal para descartar la obstrucción de la vena pélvica proximal.",
  "Screens for popliteal and femoral artery aneurysms, measuring transverse and longitudinal diameters and evaluating for intraluminal thrombus.": "Detección de aneurismas de las arterias poplítea y femoral, medición de diámetros transversales y longitudinales y evaluación de trombos intraluminales.",
  "Wide-angle transabdominal evaluation of uterine size, contour, large fibroids, and gross pelvic anatomy using a full bladder acoustic window.": "Evaluación transabdominal de gran angular del tamaño y contorno del útero, fibromas grandes y anatomía pélvica macroscópica utilizando una ventana acústica de vejiga llena.",
  "Evaluates transitional zone enlargement, glandular symmetry, and assesses intravesical prostatic protrusion (IPP) elevating the bladder floor.": "Evalúa el agrandamiento de la zona de transición, la simetría glandular y evalúa la protrusión prostática intravesical (PPI) que eleva el piso de la vejiga.",
  "We accommodate patients with or without a direct doctor's order, and we also accept physician requisitions sent from your healthcare provider.": "Atendemos a pacientes con o sin orden médica directa y también aceptamos solicitudes de médicos enviadas por su proveedor de atención médica.",
  "Screening and surveillance of the infrarenal abdominal aorta to measure caliber and rule out abdominal aortic aneurysm (AAA) or mural thrombus.": "Cribado y vigilancia de la aorta abdominal infrarrenal para medir calibre y descartar aneurisma de aorta abdominal (AAA) o trombo mural.",
  "Pinpoints focal atherosclerotic plaques, calculates velocity ratios across narrowed segments, and identifies collateral reconstitution pathways.": "Identifica placas ateroscleróticas focales, calcula relaciones de velocidad a través de segmentos estrechados e identifica vías de reconstitución colateral.",
  "Identifies echogenic calculi, measures stone size, evaluates posterior acoustic shadowing, and checks for twinkling artifacts with color Doppler.": "Identifica cálculos ecogénicos, mide el tamaño de los cálculos, evalúa la sombra acústica posterior y comprueba si hay artefactos centelleantes con Doppler color.",
  "Rapid, accurate ultrasound duplex evaluation of deep and superficial leg veins to rule out deep vein thrombosis (DVT) and evaluate venous reflux.": "Evaluación dúplex por ultrasonido rápida y precisa de las venas profundas y superficiales de las piernas para descartar la trombosis venosa profunda (TVP) y evaluar el reflujo venoso.",
  "Accurately measures transverse, anteroposterior, and longitudinal prostate diameters, calculating total prostate volume in cubic centimeters (cc).": "Mide con precisión los diámetros transversal, anteroposterior y longitudinal de la próstata, calculando el volumen total de la próstata en centímetros cúbicos (cc).",
  "Evaluates external carotid flow patterns and assesses vertebral artery flow direction to identify subclavian steal syndrome or vertebral hypoplasia.": "Evalúa los patrones de flujo de la carótida externa y evalúa la dirección del flujo de la arteria vertebral para identificar el síndrome de robo de la subclavia o la hipoplasia vertebral.",
  "Examines the great saphenous vein (GSV) and small saphenous vein (SSV) for superficial clot, wall thickening, and saphenofemoral junction competence.": "Examina la vena safena mayor (GSV) y la vena safena menor (SSV) en busca de coágulos superficiales, engrosamiento de la pared y competencia de la unión safenofemoral.",
  "We operate strictly by appointment to ensure prompt attention and comfortable patient care. Convenient on-site parking is available for all visitors.": "Operamos estrictamente con cita previa para garantizar una atención rápida y una atención cómoda al paciente. Un cómodo estacionamiento en el lugar está disponible para todos los visitantes.",
  "Examines bladder lumen, wall thickness, diverticula, and calculates precise pre-void and post-void residual urine volumes to assess urinary retention.": "Examina la luz de la vejiga, el grosor de la pared, los divertículos y calcula con precisión los volúmenes de orina residual premiccional y posmiccional para evaluar la retención urinaria.",
  "Focused high-resolution ultrasound imaging targeting specific organs and superficial soft-tissue structures evaluated by board-certified radiologists.": "Imágenes de ultrasonido enfocadas de alta resolución dirigidas a órganos específicos y estructuras superficiales de tejidos blandos evaluadas por radiólogos certificados.",
  "Focused, 100% radiation-free ultrasound imaging providing targeted characterization of palpable breast lumps, localized pain, and dense breast tissue.": "Imágenes de ultrasonido enfocadas y 100% libres de radiación que brindan una caracterización específica de bultos mamarios palpables, dolor localizado y tejido mamario denso.",
  "High-resolution hemodynamic duplex ultrasound screening the extracranial carotid arteries to detect stenosis, atherosclerotic plaque, and stroke risk.": "Ultrasonido dúplex hemodinámico de alta resolución que examina las arterias carótidas extracraneales para detectar estenosis, placa aterosclerótica y riesgo de accidente cerebrovascular.",
  "High-frequency imaging assessing testicular pain, swelling, hydrocele, varicocele, epididymitis, orchitis, and testicular microcalcifications or masses.": "Imágenes de alta frecuencia que evalúan dolor testicular, hinchazón, hidrocele, varicocele, epididimitis, orquitis y microcalcificaciones o masas testiculares.",
  "High-frequency superficial ultrasound providing detailed evaluation of thyroid nodules, goiter, cervical lymph nodes, and scrotal/testicular structures.": "Ultrasonido superficial de alta frecuencia que proporciona una evaluación detallada de los nódulos tiroideos, el bocio, los ganglios linfáticos cervicales y las estructuras escrotales/testiculares.",
  "Quantifies peak systolic velocity (PSV), end-diastolic velocity (EDV), and the ICA/CCA velocity ratio to grade stenosis according to consensus criteria.": "Cuantifica la velocidad sistólica máxima (PSV), la velocidad telediastólica (EDV) y la relación de velocidad ICA/CCA con respecto al grado de estenosis según criterios de consenso.",
  "Real-time spectral and color Doppler measuring blood velocities across the aortic, mitral, tricuspid, and pulmonary valves for stenosis or regurgitation.": "Doppler espectral y color en tiempo real que mide las velocidades de la sangre a través de las válvulas aórtica, mitral, tricúspide y pulmonar para detectar estenosis o regurgitación.",
  "Differentiates healthy high-resistance triphasic waveforms from biphasic, monophasic, or dampened tardus-parvus waveforms indicative of upstream stenosis.": "Diferencia las formas de onda trifásicas saludables de alta resistencia de las formas de onda bifásicas, monofásicas o de tardus-parvus amortiguadas que indican una estenosis aguas arriba.",
  "Diagnostic findings are processed and transmitted to referring doctors within 24 to 48 hours, with prompt phone notifications for urgent clinical findings.": "Los resultados del diagnóstico se procesan y transmiten a los médicos remitentes en un plazo de 24 a 48 horas, con notificaciones telefónicas inmediatas en caso de hallazgos clínicos urgentes.",
  "Visualizes the pancreatic head, uncinate process, body, and tail to detect pancreatitis, parenchymal calcifications, ductal dilation, or pancreatic masses.": "Visualiza la cabeza pancreática, el proceso uncinado, el cuerpo y la cola para detectar pancreatitis, calcificaciones parenquimatosas, dilatación ductal o masas pancreáticas.",
  "Fax your patient's signed clinical requisition or EHR face sheet directly to our intake desk. Our team immediately coordinates scheduling with your patient.": "Envíe por fax la solicitud clínica firmada de su paciente o la hoja frontal de EHR directamente a nuestro mostrador de admisión. Nuestro equipo coordina inmediatamente la programación con su paciente.",
  "No special preparation or fasting is needed. Wear a loose, comfortable collarless shirt or blouse. Avoid wearing neck jewelry on the day of the examination.": "No se necesita preparación especial ni ayuno. Use una camisa o blusa holgada y cómoda sin cuello. Evite usar joyas en el cuello el día del examen.",
  "Complete non-invasive transthoracic echocardiogram (TTE) evaluating left ventricular ejection fraction, myocardial wall motion, and heart valve hemodynamics.": "Ecocardiograma transtorácico (ETT) no invasivo completo que evalúa la fracción de eyección del ventrículo izquierdo, el movimiento de la pared del miocardio y la hemodinámica de la válvula cardíaca.",
  "Detailed sonographic assessment of the female reproductive anatomy. Evaluates uterine architecture, myometrium, endometrial thickness, and bilateral ovaries.": "Evaluación ecográfica detallada de la anatomía reproductiva femenina. Evalúa la arquitectura uterina, el miometrio, el grosor del endometrio y los ovarios bilaterales.",
  "Every scan is formally evaluated and signed by licensed, board-certified radiologists, providing high-fidelity diagnostic reports your physician can rely upon.": "Cada exploración es evaluada y firmada formalmente por radiólogos autorizados y certificados, lo que proporciona informes de diagnóstico de alta fidelidad en los que su médico puede confiar.",
  "Volumetric 3D surface rendering and real-time 4D motion capturing expressive fetal facial movements, yawns, and smiles in a warm, welcoming outpatient setting.": "Representación volumétrica de superficies en 3D y movimiento 4D en tiempo real que captura movimientos faciales fetales expresivos, bostezos y sonrisas en un entorno ambulatorio cálido y acogedor.",
  "Comprehensive evaluation of solid internal organs in the upper and mid-abdomen. Assesses organ size, parenchymal architecture, focal lesions, cysts, and stones.": "Evaluación integral de órganos internos sólidos en el abdomen superior y medio. Evalúa el tamaño de los órganos, la arquitectura parenquimatosa, las lesiones focales, los quistes y los cálculos.",
  "Includes full 2D, M-Mode, Color Flow Doppler, and Spectral Doppler quantitative analysis with guaranteed radiologist/cardiologist turnaround within 24–48 hours.": "Incluye análisis cuantitativo completo 2D, modo M, Doppler de flujo color y Doppler espectral con respuesta garantizada del radiólogo/cardiólogo en un plazo de 24 a 48 horas.",
  "Our Chicago clinic operates strictly by appointment only to eliminate waiting room delays. Reserve your appointment online or call our clinical scheduling team.": "Nuestra clínica de Chicago opera estrictamente con cita previa para eliminar demoras en la sala de espera. Reserve su cita en línea o llame a nuestro equipo de programación clínica.",
  "Full coaptation testing of the common femoral vein (CFV), femoral vein (FV), deep femoral vein (profunda), and popliteal vein to confirm complete lumen collapse.": "Prueba de coaptación completa de la vena femoral común (CFV), la vena femoral (FV), la vena femoral profunda (profunda) y la vena poplítea para confirmar el colapso completo de la luz.",
  "Precise measurement of left ventricular systolic and diastolic function, calculation of ejection fraction, and stroke volume using Simpson's biplane methodology.": "Medición precisa de la función sistólica y diastólica del ventrículo izquierdo, cálculo de la fracción de eyección y volumen sistólico utilizando la metodología biplano de Simpson.",
  "We accept all standard clinic order pads, EHR printed requisitions, or our downloadable order form. Choose the transmission method most convenient for your staff:": "Aceptamos todos los talonarios de pedidos de clínicas estándar, solicitudes impresas de EHR o nuestro formulario de pedido descargable. Elija el método de transmisión más conveniente para su personal:",
  "Accurate 3D volume measurements of right and left thyroid lobes and isthmus, assessing parenchymal echotexture for thyroiditis (e.g. Hashimoto's, Graves' disease).": "Mediciones precisas de volumen en 3D de los lóbulos tiroideos derecho e izquierdo y del istmo, evaluando la ecotextura parenquimatosa para detectar tiroiditis (p. ej., enfermedad de Hashimoto, enfermedad de Graves).",
  "Grades caliectasis and pelviectasis (mild, moderate, severe) to identify urinary tract obstruction caused by ureteral calculi, strictures, or external compression.": "Califica las caliectasias y pelviectasias (leve, moderada, grave) para identificar la obstrucción del tracto urinario causada por cálculos ureterales, estenosis o compresión externa.",
  "Measures bipolar renal length and assesses parenchymal cortical thickness and corticomedullary differentiation to evaluate chronic kidney disease (CKD) or atrophy.": "Mide la longitud renal bipolar y evalúa el espesor cortical parenquimatoso y la diferenciación corticomedular para evaluar la enfermedad renal crónica (ERC) o la atrofia.",
  "Please bring a valid photo ID, your health insurance card (if utilizing insurance), and any medical order or requisition form provided by your referring physician.": "Traiga una identificación con fotografía válida, su tarjeta de seguro médico (si utiliza un seguro) y cualquier orden médica o formulario de solicitud proporcionado por su médico remitente.",
  "Positive DVT findings are treated with urgent physician notification. A board-certified radiologist report is faxed immediately to the referring provider's office.": "Los hallazgos positivos de TVP se tratan con notificación urgente al médico. Un informe de un radiólogo certificado se envía inmediatamente por fax al consultorio del proveedor remitente.",
  "Your provider creates an ultrasound requisition on your standard clinic order pad, hospital EHR sheet, or prescription pad specifying clinical indication & ICD-10.": "Su proveedor crea una solicitud de ultrasonido en su libreta de pedidos clínica estándar, hoja de HCE del hospital o talonario de recetas que especifica la indicación clínica y la CIE-10.",
  "Evaluated by board-certified radiologists with detailed measurements of both kidneys, cortical thickness, hydronephrosis grading, and pre/post-void bladder volumes.": "Evaluado por radiólogos certificados con mediciones detalladas de ambos riñones, grosor cortical, clasificación de hidronefrosis y volúmenes de la vejiga antes y después de la micción.",
  "Evaluation of major arterial and venous pathways throughout the body using pulse-wave and color Doppler to assess blood velocity, stenosis, and circulatory patency.": "Evaluación de las principales vías arteriales y venosas de todo el cuerpo mediante onda de pulso y Doppler color para evaluar la velocidad de la sangre, la estenosis y la permeabilidad circulatoria.",
  "Non-OB transabdominal and transvaginal ultrasound evaluating reproductive organs, urinary tract, pelvic floor, and checking for conditions like ectopic pregnancies.": "Ultrasonido transabdominal y transvaginal no obstétrico que evalúa los órganos reproductivos, el tracto urinario, el suelo pélvico y detecta afecciones como embarazos ectópicos.",
  "Comprehensive, radiation-free ultrasound imaging of the liver, gallbladder, pancreas, kidneys, spleen, and abdominal aorta evaluated by board-certified radiologists.": "Imágenes ecográficas completas y sin radiación del hígado, la vesícula biliar, el páncreas, los riñones, el bazo y la aorta abdominal evaluadas por radiólogos certificados.",
  "A board-certified radiologist evaluates and signs the diagnostic report, transmitted to your office within 24–48 hours. STAT critical findings are phoned immediately.": "Un radiólogo certificado evalúa y firma el informe de diagnóstico, que se transmite a su consultorio en un plazo de 24 a 48 horas. Los hallazgos críticos de STAT se comunican de inmediato.",
  "Definitively distinguishes simple benign fluid-filled cysts (anechoic with posterior enhancement) from complex cysts or solid lesions requiring radiologist follow-up.": "Distingue definitivamente los quistes benignos simples llenos de líquido (anecoicos con realce posterior) de los quistes complejos o lesiones sólidas que requieren seguimiento radiólogo.",
  "Detailed sonographic characterization of nodule size, composition, echogenicity, margins, shape, and microcalcifications with TI-RADS radiologist risk stratification.": "Caracterización ecográfica detallada del tamaño, composición, ecogenicidad, márgenes, forma y microcalcificaciones del nódulo con estratificación de riesgo radiólogo TI-RADS.",
  "The patient receives a dedicated, radiation-free ultrasound in our Chicago facility. Operating by appointment only ensures zero wait times and complete patient focus.": "El paciente recibe una ecografía exclusiva y sin radiación en nuestras instalaciones de Chicago. Operar con cita previa solo garantiza cero tiempos de espera y una completa atención al paciente.",
  "All examinations at Perfect Diagnostic Ultrasound are 100% radiation-free, non-invasive, and evaluated by expert radiologists with prompt, accurate diagnostic reports.": "Todos los exámenes realizados en Perfect Diagnostic Ultrasound son 100% libres de radiación, no invasivos y evaluados por radiólogos expertos con informes de diagnóstico rápidos y precisos.",
  "By operating strictly by appointment, we ensure our clinical team is completely prepared for your arrival, eliminating waiting room congestion and respecting your time.": "Al operar estrictamente con cita previa, nos aseguramos de que nuestro equipo clínico esté completamente preparado para su llegada, eliminando la congestión de la sala de espera y respetando su tiempo.",
  "Confirmation of intrauterine pregnancy, precise gestational age dating via crown-rump length (CRL), early fetal heartbeat detection, and exclusion of ectopic pregnancy.": "Confirmación de embarazo intrauterino, datación precisa de la edad gestacional mediante la longitud cráneo-rabadilla (CRL), detección temprana de latidos cardíacos fetales y exclusión de embarazo ectópico.",
  "Essential workup for patients with transient ischemic attacks (TIA), carotid bruits, amaurosis fugax, focal neurological deficits, syncope, or high cardiovascular risk.": "Estudio esencial para pacientes con ataques isquémicos transitorios (AIT), soplos carotídeos, amaurosis fugaz, déficits neurológicos focales, síncope o alto riesgo cardiovascular.",
  "Detection and quantification of pericardial effusions, measurement of the ascending aorta and aortic root dimensions, and right ventricular systolic pressure estimation.": "Detección y cuantificación de derrames pericárdicos, medición de las dimensiones de la aorta ascendente y de la raíz aórtica y estimación de la presión sistólica del ventrículo derecho.",
  "Transthoracic echocardiogram (TTE) provides non-invasive imaging of heart chambers, valves, and surrounding great vessels to assess cardiac performance and hemodynamics.": "El ecocardiograma transtorácico (ETT) proporciona imágenes no invasivas de las cámaras del corazón, las válvulas y los grandes vasos circundantes para evaluar el rendimiento cardíaco y la hemodinámica.",
  "Evaluates uterine size, contour, and position. Accurately maps and measures uterine fibroids (leiomyomas), detects adenomyosis, and assesses congenital uterine anomalies.": "Evalúa el tamaño, el contorno y la posición del útero. Mapea y mide con precisión los fibromas uterinos (leiomiomas), detecta adenomiosis y evalúa anomalías uterinas congénitas.",
  "High-resolution transabdominal and endovaginal sonography assessing uterine architecture, endometrial lining, and ovarian structures for comprehensive gynecological care.": "Ecografía transabdominal y endovaginal de alta resolución que evalúa la arquitectura uterina, el revestimiento endometrial y las estructuras ováricas para una atención ginecológica integral.",
  "Monitoring fetal growth parameters (BPD, HC, AC, FL), estimated fetal weight (EFW), fetal position/presentation, umbilical artery Doppler flow, and amniotic fluid volume.": "Monitoreo de los parámetros de crecimiento fetal (BPD, HC, AC, FL), peso fetal estimado (EFW), posición/presentación fetal, flujo Doppler de la arteria umbilical y volumen de líquido amniótico.",
  "Systematic evaluation of 16-17 myocardial segments to identify hypokinesia, akinesia, or dyskinesia associated with coronary artery disease or past myocardial infarction.": "Evaluación sistemática de 16 a 17 segmentos de miocardio para identificar hipocinesia, acinesia o discinesia asociada con enfermedad de las arterias coronarias o infarto de miocardio pasado.",
  "Preparation instructions depend on the specific ultrasound exam being performed. Our clinical staff provides clear, tailored instructions when scheduling your appointment.": "Las instrucciones de preparación dependen del examen de ultrasonido específico que se esté realizando. Nuestro personal clínico brinda instrucciones claras y personalizadas al programar su cita.",
  "To ensure all patients feel comfortable and fully understood, we are proud to offer services in multiple languages, including English, Spanish, Russian, Punjabi, and Urdu.": "Para garantizar que todos los pacientes se sientan cómodos y completamente comprendidos, estamos orgullosos de ofrecer servicios en varios idiomas, incluidos inglés, español, ruso, punjabi y urdu.",
  "Detailed radiologist reports quantify endometrial thickness and provide exact three-plane measurements of all fibroids and ovarian cysts with color Doppler flow assessment.": "Los informes detallados del radiólogo cuantifican el grosor del endometrio y proporcionan mediciones exactas en tres planos de todos los fibromas y quistes ováricos con evaluación del flujo Doppler color.",
  "Arrive with a comfortably full bladder by drinking 24–32 oz of water completed 1 hour prior to the exam. Do not void before the initial ultrasound measurements are captured.": "Llegue con la vejiga cómodamente llena bebiendo entre 24 y 32 onzas de agua 1 hora antes del examen. No anule antes de que se capturen las mediciones ecográficas iniciales.",
  "Independent outpatient diagnostic ultrasound clinic in Chicago providing clinical ultrasound evaluated by board-certified radiologists. Operating strictly by appointment only.": "Clínica independiente de ultrasonido de diagnóstico para pacientes ambulatorios en Chicago que brinda ultrasonido clínico evaluado por radiólogos certificados. Operando estrictamente solo con cita previa.",
  "No fasting or special preparation is necessary. Wear loose-fitting trousers or shorts that can be easily rolled up or removed. Continue all medications, including anticoagulants.": "No es necesario ayunar ni realizar ninguna preparación especial. Use pantalones o pantalones cortos holgados que se puedan enrollar o quitar fácilmente. Continúe con todos los medicamentos, incluidos los anticoagulantes.",
  "Your trusted clinical imaging partner in Chicago. Dedicated to medical precision, patient compassion, and rapid diagnostic turnaround with over 25 years of sonography experience.": "Su socio de confianza en imágenes clínicas en Chicago. Dedicado a la precisión médica, la compasión del paciente y la rápida respuesta diagnóstica con más de 25 años de experiencia en ecografía.",
  "All thyroid nodule reports feature formal ACR TI-RADS scoring with precise millimeter measurements and vascular color Doppler documentation to guide follow-up or biopsy decisions.": "Todos los informes de nódulos tiroideos cuentan con puntuación formal ACR TI-RADS con mediciones milimétricas precisas y documentación vascular Doppler color para guiar las decisiones de seguimiento o biopsia.",
  "Comprehensive color Doppler and spectral Doppler velocity assessment of the aortic, mitral, tricuspid, and pulmonary valves for stenosis, regurgitation, prolapse, or calcification.": "Evaluación integral de la velocidad Doppler color y Doppler espectral de las válvulas aórtica, mitral, tricúspide y pulmonar para detectar estenosis, regurgitación, prolapso o calcificación.",
  "Comprehensive prenatal sonography evaluated by board-certified radiologists, from early pregnancy viability to detailed second-trimester anatomy surveys and elective 3D/4D fetal imaging.": "Ecografía prenatal integral evaluada por radiólogos certificados, desde la viabilidad temprana del embarazo hasta estudios detallados de la anatomía del segundo trimestre e imágenes fetales electivas en 3D/4D.",
  "Comprehensive segmental documentation with Doppler velocity ratios, waveform classification, and anatomical localization of arterial obstruction for vascular and primary care physicians.": "Documentación segmentaria completa con índices de velocidad Doppler, clasificación de formas de onda y localización anatómica de la obstrucción arterial para médicos vasculares y de atención primaria.",
  "We accept obstetrical orders on any standard physician requisition pad or EHR printout. Routine and high-risk pregnancy evaluations receive prompt radiologist reports within 24–48 hours.": "Aceptamos órdenes obstétricas en cualquier cuaderno de solicitudes de médico estándar o en una copia impresa de EHR. Las evaluaciones de embarazos de rutina y de alto riesgo reciben informes rápidos del radiólogo dentro de las 24 a 48 horas.",
  "Ideal for patients presenting with right upper quadrant (RUQ) pain, epigastric distress, elevated LFTs, or routine screening. STAT phone reports are available for acute surgical findings.": "Ideal para pacientes que presentan dolor en el cuadrante superior derecho (RUQ), malestar epigástrico, LFT elevados o exámenes de detección de rutina. Los informes telefónicos urgentes están disponibles para hallazgos quirúrgicos agudos.",
  "Identifies gallstones (cholelithiasis), gallbladder wall thickening, pericholecystic fluid indicative of acute cholecystitis, biliary sludge, and measures the common bile duct (CBD) caliber.": "Identifica cálculos biliares (colelitiasis), engrosamiento de la pared de la vesícula biliar, líquido pericolecístico indicativo de colecistitis aguda, lodo biliar y mide el calibre del conducto biliar común (CBD).",
  "Bilateral evaluation of ovarian dimensions, follicle count, detection of simple cysts, hemorrhagic cysts, endometriomas, dermoids (teratomas), and polycystic ovary syndrome (PCOS) morphology.": "Evaluación bilateral de dimensiones ováricas, recuento de folículos, detección de quistes simples, quistes hemorrágicos, endometriomas, dermoides (teratomas) y morfología del síndrome de ovario poliquístico (SOP).",
  "Complete volume calculations and post-void residual analysis are included in every final radiologist report, assisting primary care physicians and urologists with targeted treatment planning.": "En cada informe final del radiólogo se incluyen cálculos de volumen completos y análisis de residuos posmiccionales, lo que ayuda a los médicos de atención primaria y a los urólogos con la planificación del tratamiento específico.",
  "Preparation instructions depend entirely on the specific ultrasound exam being performed. Our clinical team provides clear, tailored guidance directly to you when scheduling your appointment.": "Las instrucciones de preparación dependen completamente del examen de ultrasonido específico que se esté realizando. Nuestro equipo clínico le brinda orientación clara y personalizada directamente al programar su cita.",
  "Evaluates hepatic dimensions, diffuse fatty infiltration (steatosis), cirrhosis, surface nodularity, vascular patency (portal and hepatic veins), and identifies focal hepatic lesions or cysts.": "Evalúa las dimensiones hepáticas, la infiltración grasa difusa (esteatosis), la cirrosis, la nodularidad de la superficie, la permeabilidad vascular (venas porta y hepática) e identifica quistes o lesiones hepáticas focales.",
  "All breast ultrasound examinations are categorized according to the ACR BI-RADS (Breast Imaging Reporting and Data System) lexicon by board-certified radiologists with prompt 24-48hr turnaround.": "Todos los exámenes de ultrasonido de mama se clasifican de acuerdo con el léxico ACR BI-RADS (Sistema de datos e informes de imágenes de mama) realizados por radiólogos certificados con un tiempo de respuesta rápido de 24 a 48 horas.",
  "STAT and critical findings (such as acute deep vein thrombosis, ectopic pregnancy, or severe acute abnormalities) are immediately telephoned to your office by our staff or interpreting radiologist.": "Nuestro personal o el radiólogo intérprete llaman inmediatamente a su consultorio por teléfono a su consultorio con las pruebas urgentes y los hallazgos críticos (como trombosis venosa profunda aguda, embarazo ectópico o anomalías agudas graves).",
  "Precise measurement of endometrial thickness to evaluate abnormal uterine bleeding (AUB), postmenopausal bleeding, endometrial hyperplasia, polyps, or intrauterine contraceptive device (IUD) localization.": "Medición precisa del espesor endometrial para evaluar sangrado uterino anormal (SUA), sangrado posmenopáusico, hiperplasia endometrial, pólipos o localización del dispositivo anticonceptivo intrauterino (DIU).",
  "Every ultrasound examination is evaluated and interpreted by board-certified radiologists, ensuring your physician receives the detailed anatomical insights needed for timely diagnosis and treatment planning.": "Cada examen de ultrasonido es evaluado e interpretado por radiólogos certificados, lo que garantiza que su médico reciba la información anatómica detallada necesaria para un diagnóstico y una planificación del tratamiento oportunos.",
  "For thyroid imaging: Wear a comfortable, loose open-collar shirt or blouse; avoid turtlenecks. Remove necklaces before the scan. For scrotal imaging: No special prep is needed; wear loose, comfortable clothing.": "Para imágenes de tiroides: use una camisa o blusa cómoda y holgada con cuello abierto; Evite los cuellos de tortuga. Quítese los collares antes del escaneo. Para imágenes escrotales: no se necesita ninguna preparación especial; use ropa holgada y cómoda.",
  "No fasting required. Avoid smoking, vaping, or consuming heavy caffeine for at least 2 hours before the examination, as nicotine and caffeine induce peripheral vasoconstriction that can alter Doppler waveforms.": "No se requiere ayuno. Evite fumar, vapear o consumir mucha cafeína durante al menos 2 horas antes del examen, ya que la nicotina y la cafeína inducen vasoconstricción periférica que puede alterar las formas de onda Doppler.",
  "Detailed reports include grayscale plaque morphological descriptions, color Doppler documentation, and spectral velocity waveforms conforming to the Society of Radiologists in Ultrasound (SRU) consensus criteria.": "Los informes detallados incluyen descripciones morfológicas de la placa en escala de grises, documentación Doppler color y formas de onda de velocidad espectral que cumplen con los criterios de consenso de la Sociedad de Radiólogos en Ultrasonido (SRU).",
  "Partner with Perfect Diagnostic Ultrasound for hospital-grade diagnostic sonography, prompt patient scheduling, and 24–48 hour board-certified radiologist reports — without hospital delays or excessive facility fees.": "Asóciese con Perfect Diagnostic Ultrasound para obtener ecografías de diagnóstico de nivel hospitalario, programación rápida de pacientes e informes de radiólogos certificados de 24 a 48 horas, sin demoras hospitalarias ni tarifas excesivas de las instalaciones.",
  "Direct visualization and Doppler velocity measurements along the common femoral artery (CFA), superficial femoral artery (SFA), popliteal artery, anterior tibial (ATA), posterior tibial (PTA), and dorsalis pedis (DPA).": "Visualización directa y mediciones de velocidad Doppler a lo largo de la arteria femoral común (CFA), la arteria femoral superficial (SFA), la arteria poplítea, la tibial anterior (ATA), la tibial posterior (PTA) y el dorsal del pie (DPA).",
  "No dietary restrictions or fasting are required for a transthoracic echocardiogram. Please wear a comfortable two-piece outfit that allows easy access to the chest. Continue taking all regular cardiac medications as prescribed.": "No se requieren restricciones dietéticas ni ayuno para un ecocardiograma transtorácico. Utilice un traje cómodo de dos piezas que permita un fácil acceso al pecho. Continúe tomando todos los medicamentos cardíacos habituales según lo prescrito.",
  "We believe quality healthcare should be accessible to all patients regardless of insurance coverage. We offer personalized consultations to review your imaging requisitions and coordinate diagnostic reports with your physician.": "Creemos que todos los pacientes deben tener acceso a atención médica de calidad, independientemente de su cobertura de seguro. Ofrecemos consultas personalizadas para revisar sus solicitudes de imágenes y coordinar informes de diagnóstico con su médico.",
  "Yes. We accept any valid medical order signed by a licensed physician (MD/DO), nurse practitioner (NP), or physician assistant (PA) that includes patient demographics, requested examination, and clinical indication or ICD-10 code.": "Sí. Aceptamos cualquier orden médica válida firmada por un médico autorizado (MD/DO), una enfermera practicante (NP) o un asistente médico (PA) que incluya datos demográficos del paciente, examen solicitado e indicación clínica o código ICD-10.",
  "Obstetrical sonography monitors fetal development, anatomy, and maternal health across all trimesters of pregnancy. Ultrasound uses gentle sound waves with zero ionizing radiation, ensuring complete safety for both parent and baby.": "La ecografía obstétrica monitorea el desarrollo fetal, la anatomía y la salud materna en todos los trimestres del embarazo. El ultrasonido utiliza ondas sonoras suaves sin radiación ionizante, lo que garantiza una seguridad total tanto para los padres como para el bebé.",
  "Detailed evaluation of fetal organs including cranial ventricles, facial profile, four-chamber cardiac views and outflow tracts, spine alignment, kidneys, stomach bubble, bladder, limbs, placental location, and amniotic fluid index.": "Evaluación detallada de los órganos fetales, incluidos los ventrículos craneales, el perfil facial, las vistas cardíacas de cuatro cámaras y los tractos de salida, la alineación de la columna, los riñones, la burbuja estomacal, la vejiga, las extremidades, la ubicación de la placenta y el índice de líquido amniótico.",
  "We perform medical ultrasound scans in accordance with doctor recommendations and medical orders. Every scan is evaluated by expert radiologists with prompt, accurate diagnostic reports provided for you and your healthcare provider.": "Realizamos ecografías médicas de acuerdo con las recomendaciones y órdenes médicas. Cada exploración es evaluada por radiólogos expertos y se proporcionan informes de diagnóstico rápidos y precisos para usted y su proveedor de atención médica.",
  "Major health insurances are accepted. Patients without insurance benefit from our transparent self-pay pricing with no surprise hospital bills. Our multilingual staff provides compassionate care in English, Spanish, Russian, Punjabi, and Urdu.": "Se aceptan los principales seguros de salud. Los pacientes sin seguro se benefician de nuestros precios transparentes de pago por cuenta propia sin facturas hospitalarias sorpresa. Nuestro personal multilingüe brinda atención compasiva en inglés, español, ruso, punjabi y urdu.",
  "No dietary restrictions. Wear a comfortable two-piece outfit. Do not apply deodorants, antiperspirants, talcum powders, lotions, or perfumes under the arms or on the breast area on the day of the exam, as residues can create sonographic artifacts.": "Sin restricciones dietéticas. Lleva un conjunto cómodo de dos piezas. No aplique desodorantes, antitranspirantes, talco, lociones o perfumes debajo de los brazos o en el área de los senos el día del examen, ya que los residuos pueden crear artefactos ecográficos.",
  "Drink 24–32 oz of water finished 1 hour before your appointment so that your urinary bladder is comfortably distended. Do not urinate until the sonographer completes the pre-void bladder measurements. You will then be given time to void for the post-void evaluation.": "Beba de 24 a 32 onzas de agua terminada 1 hora antes de su cita para que su vejiga urinaria esté cómodamente distendida. No orine hasta que el ecografista complete las mediciones previas a la evacuación de la vejiga. Luego se le dará tiempo para anular para la evaluación posterior a la anulación.",
  "Prostate diagnostic ultrasound offers a comfortable, non-invasive assessment of the prostate gland and bladder base. It helps physicians evaluate benign prostatic hyperplasia (BPH), urinary outflow obstruction, and elevated PSA levels without radiation or invasive discomfort.": "La ecografía de diagnóstico de próstata ofrece una evaluación cómoda y no invasiva de la glándula prostática y la base de la vejiga. Ayuda a los médicos a evaluar la hiperplasia prostática benigna (HPB), la obstrucción del flujo urinario y los niveles elevados de PSA sin radiación ni molestias invasivas.",
  "For the transabdominal portion, arrive with a fully distended bladder by drinking 32–40 oz of water finished 1 hour before your scan; do not void. If a transvaginal scan is clinically indicated and consented to, you will be instructed to empty your bladder completely just before the procedure.": "Para la porción transabdominal, llegue con la vejiga completamente distendida bebiendo entre 32 y 40 onzas de agua 1 hora antes de la exploración; no anules. Si está clínicamente indicado y se acepta una exploración transvaginal, se le indicará que vacíe la vejiga por completo justo antes del procedimiento.",
  "For first-trimester examinations (< 14 weeks), please drink 32 oz of water finished 1 hour before your appointment and do not empty your bladder. For second- and third-trimester anatomy surveys, normal hydration is recommended, along with a light snack 30 minutes prior to encourage fetal activity.": "Para los exámenes del primer trimestre (<14 semanas), beba 32 oz de agua terminada 1 hora antes de su cita y no vacíe la vejiga. Para los estudios de anatomía del segundo y tercer trimestre, se recomienda una hidratación normal, junto con un refrigerio ligero 30 minutos antes para estimular la actividad fetal.",
  ", we provide hospital-grade diagnostic ultrasound examinations in a comfortable, personal outpatient setting. With an unwavering commitment to precision, compassion, and professional integrity, we fulfill your imaging needs without the long waits or high facility fees of hospital radiology departments.": ", brindamos exámenes de ultrasonido de diagnóstico de nivel hospitalario en un ambiente ambulatorio cómodo y personal. Con un compromiso inquebrantable con la precisión, la compasión y la integridad profesional, satisfacemos sus necesidades de imágenes sin las largas esperas ni las altas tarifas de los departamentos de radiología de los hospitales.",
  "Pelvic ultrasound is a delicate, compassionate diagnostic evaluation designed to provide detailed anatomical insight into the female reproductive system. Our certified female sonographers provide respectful, private care, utilizing high-frequency digital probes evaluated by board-certified radiologists.": "La ecografía pélvica es una evaluación diagnóstica delicada y compasiva diseñada para proporcionar una visión anatómica detallada del sistema reproductivo femenino. Nuestras ecografistas certificadas brindan atención privada y respetuosa, utilizando sondas digitales de alta frecuencia evaluadas por radiólogos certificados.",
  "Renal and bladder ultrasound is a non-invasive, radiation-free diagnostic test assessing the upper and lower urinary tracts. It is the initial imaging study of choice for evaluating flank pain, suspected kidney stones, hematuria (blood in urine), recurrent urinary tract infections, and renal impairment.": "La ecografía renal y vesical es una prueba de diagnóstico no invasiva y sin radiación que evalúa las vías urinarias superiores e inferiores. Es el estudio de imagen inicial de elección para evaluar el dolor en el flanco, la sospecha de cálculos renales, la hematuria (sangre en la orina), las infecciones recurrentes del tracto urinario y la insuficiencia renal.",
  "High-frequency linear ultrasound probes deliver extraordinary spatial resolution for superficial soft-tissue structures located close to the skin surface. Our clinic specializes in detailed sonography of the thyroid gland, neck lymph nodes, and scrotal structures evaluated by board-certified radiologists.": "Las sondas de ultrasonido lineal de alta frecuencia brindan una resolución espacial extraordinaria para estructuras superficiales de tejidos blandos ubicadas cerca de la superficie de la piel. Nuestra clínica se especializa en ecografía detallada de la glándula tiroides, los ganglios linfáticos del cuello y las estructuras escrotales evaluadas por radiólogos certificados.",
  "Carotid duplex sonography combines high-resolution B-mode imaging with pulse-wave spectral Doppler and color Doppler to measure blood velocity and visualize the walls of the carotid arteries. It is the gold standard, non-invasive method for detecting carotid artery narrowing and preventing ischemic stroke.": "La ecografía dúplex carotídea combina imágenes en modo B de alta resolución con Doppler espectral de onda de pulso y Doppler color para medir la velocidad de la sangre y visualizar las paredes de las arterias carótidas. Es el método no invasivo de referencia para detectar el estrechamiento de la arteria carótida y prevenir el accidente cerebrovascular isquémico.",
  "Deep vein thrombosis (DVT) is a potentially life-threatening condition where a blood clot forms in the deep veins of the legs, posing a risk of pulmonary embolism (PE). Our clinic provides prompt, appointment-based venous duplex evaluations performed with compression sonography and spectral Doppler flow analysis.": "La trombosis venosa profunda (TVP) es una afección potencialmente mortal en la que se forma un coágulo de sangre en las venas profundas de las piernas, lo que supone un riesgo de embolia pulmonar (EP). Nuestra clínica ofrece evaluaciones venosas dúplex rápidas y basadas en citas realizadas con ecografía de compresión y análisis de flujo Doppler espectral.",
  "Abdominal ultrasound provides high-resolution cross-sectional visualization of solid organs and major vascular structures within the peritoneal and retroperitoneal cavity. It is the primary frontline diagnostic exam for unexplained abdominal pain, abnormal liver function tests, jaundice, and palpable abdominal masses.": "La ecografía abdominal proporciona una visualización transversal de alta resolución de órganos sólidos y estructuras vasculares importantes dentro de la cavidad peritoneal y retroperitoneal. Es el examen de diagnóstico de primera línea para dolor abdominal inexplicable, pruebas de función hepática anormales, ictericia y masas abdominales palpables.",
  "Fasting (NPO) for 6 to 8 hours prior to your examination is strictly required. Do not eat, drink, or chew gum. Fasting ensures optimal distension of the gallbladder and reduces overlying bowel gas for clear visualization of the pancreas and aorta. Small sips of water are permitted for necessary prescription medications.": "Es estrictamente necesario ayunar (NPO) durante 6 a 8 horas antes de su examen. No coma, beba ni mastique chicle. El ayuno asegura una distensión óptima de la vesícula biliar y reduce el gas intestinal suprayacente para una visualización clara del páncreas y la aorta. Se permiten pequeños sorbos de agua para los medicamentos recetados necesarios.",
  "An echocardiogram uses acoustic sound waves to generate real-time moving images of heart chambers, muscular walls, and cardiac valves. Evaluated by board-certified specialists, our echocardiograms provide primary care physicians, cardiologists, and surgeons with the comprehensive hemodynamic data needed to guide clinical management.": "Un ecocardiograma utiliza ondas sonoras acústicas para generar imágenes en movimiento en tiempo real de las cámaras del corazón, las paredes musculares y las válvulas cardíacas. Evaluados por especialistas certificados, nuestros ecocardiogramas brindan a los médicos de atención primaria, cardiólogos y cirujanos los datos hemodinámicos completos necesarios para guiar el manejo clínico.",
  "Diagnostic breast ultrasound uses high-frequency acoustic sound waves to inspect targeted areas of breast tissue in high detail. It is completely free of ionizing radiation and serves as an essential diagnostic tool for evaluating palpable lumps, clarifying mammographic findings, and differentiating cystic lesions from solid masses.": "La ecografía mamaria de diagnóstico utiliza ondas sonoras acústicas de alta frecuencia para inspeccionar áreas específicas del tejido mamario con gran detalle. Está completamente libre de radiación ionizante y sirve como una herramienta de diagnóstico esencial para evaluar bultos palpables, aclarar los hallazgos mamográficos y diferenciar las lesiones quísticas de las masas sólidas.",
  "Lower extremity arterial duplex sonography evaluates blood flow through the arterial supply of the legs and feet. It provides critical diagnostic evidence for peripheral arterial disease (PAD), helps determine the severity of arterial narrowing, and guides treatment decisions for patients suffering from leg pain, cold extremities, or poor wound healing.": "La ecografía dúplex arterial de las extremidades inferiores evalúa el flujo sanguíneo a través del suministro arterial de las piernas y los pies. Proporciona evidencia diagnóstica crítica para la enfermedad arterial periférica (EAP), ayuda a determinar la gravedad del estrechamiento arterial y guía las decisiones de tratamiento para pacientes que sufren dolor en las piernas, extremidades frías o mala cicatrización de heridas.",
  "Obstetrical ultrasound is a non-invasive, radiation-free diagnostic imaging modality used to monitor pregnancy, assess fetal growth and anatomical development, and ensure maternal health. Every examination at Perfect Diagnostic Ultrasound is performed using advanced digital sonography systems and interpreted by board-certified radiologists with rapid 24–48hr report delivery to your obstetrician or midwife.": "La ecografía obstétrica es una modalidad de diagnóstico por imágenes no invasiva y sin radiación que se utiliza para controlar el embarazo, evaluar el crecimiento fetal y el desarrollo anatómico y garantizar la salud materna. Cada examen en Perfect Diagnostic Ultrasound se realiza utilizando sistemas avanzados de ecografía digital y es interpretado por radiólogos certificados con entrega rápida de informes a su obstetra o partera en 24 a 48 horas.",
  "Prompt, accurate diagnostic reports are provided for physician follow-up.": "Se proporcionan informes diagnósticos rápidos y precisos para el seguimiento médico.",

  "No doctor's order is strictly required for personalized health consultations and screening exams. However, if you are experiencing specific clinical symptoms or plan to bill your medical health insurance, an ultrasound requisition from your doctor, nurse practitioner, or physician assistant ensures coverage and diagnostic continuity.": "No se requiere estrictamente una orden médica para consultas de salud personalizadas y exámenes de detección preventiva. Sin embargo, si presenta síntomas clínicos específicos o planea facturar a su seguro médico, una orden de su médico garantiza la cobertura y continuidad diagnóstica.",
  "Yes. We work with all major health insurances and Medicare. We also offer affordable, transparent self-pay pricing for patients without insurance or those with high deductibles who prefer an upfront, flat rate without surprise bills.": "Sí. Trabajamos con los principales seguros médicos y Medicare. También ofrecemos precios transparentes y accesibles para pacientes sin seguro o con deducibles altos que prefieren una tarifa fija sin sorpresas.",
  "At Perfect Diagnostic Ultrasound, we understand the importance of affordability when it comes to healthcare services. That's why we offer competitive pricing for our ultrasound packages. Our goal is to provide high-quality ultrasound services at affordable rates, ensuring that everyone has access to essential medical care without financial burden.": "En Perfect Diagnostic Ultrasound, entendemos la importancia de la accesibilidad en la atención médica. Por eso ofrecemos precios competitivos para nuestros paquetes de ultrasonido, garantizando que todos tengan acceso a diagnósticos esenciales sin cargas financieras.",
  "The radiologist carefully reviews your images and provides the results within 24-48 hours. The doctor will then discuss them with you. Reports are delivered securely to you and directly to your referring healthcare provider.": "El radiólogo revisa minuciosamente sus imágenes y entrega los resultados en 24 a 48 horas. Su médico tratante los evaluará con usted. Los informes se envían de forma segura tanto a usted como a su médico remitente.",
  "Who performs an ultrasound?": "¿Quién realiza el ultrasonido?",
  "Ultrasounds are performed by technicians or sonographers. They are professionally trained to use an ultrasound machine properly and safely. It is important to always have your ultrasound done by a healthcare professional in a medical facility. Every scan is evaluated by expert radiologists with prompt, accurate diagnostic reports.": "Las ecografías son realizadas por ecografistas y tecnólogos certificados, capacitados para operar los equipos con precisión y seguridad. Cada examen es interpretado por médicos radiólogos certificados con informes diagnósticos rápidos y precisos.",
  "Are there any risks related with ultrasound?": "¿Existen riesgos relacionados con el ultrasonido?",
  "Ultrasound is generally safe and doesn’t have any known risks. It does not use ionizing radiation (unlike X-rays or CT scans) and works entirely through harmless, high-frequency sound waves.": "El ultrasonido es completamente seguro y no presenta riesgos conocidos. No utiliza radiación ionizante (a diferencia de los rayos X o tomografías) y funciona únicamente mediante ondas de sonido de alta frecuencia.",
  "Preparation depends on the examination type: • Abdominal Ultrasounds: Fast (no food or drink except water) for 8 hours prior so organs and gallbladder are clear. • Pelvic & Early OB Ultrasounds: Drink 32 oz of water 1 hour prior and avoid using the restroom to ensure a full bladder. • Vascular, Echo & Thyroid: No special fasting is typically required.": "La preparación depende del examen: • Abdominal: Ayuno de 8 horas (solo agua) para evaluar órganos y vesícula. • Pélvico y Obstétrico temprano: Tomar 32 oz (1 litro) de agua 1 hora antes y retener la orina para tener la vejiga llena. • Vascular, Eco y Tiroides: Generalmente no requieren ayuno.",
  "To ensure complete comfort and understanding, our staff and practitioners provide consultations in English, Spanish (Español), Russian (Русский), Punjabi (ਪੰਜਾਬੀ), and Urdu (اردو).": "Para garantizar total comodidad y comprensión, nuestro equipo brinda atención en inglés, español, ruso, punyabí y urdu.",
  "Our clinic is located at 7634 West Belmont Avenue, Chicago, IL 60634. Convenient on-street parking is readily available directly in front of and along Belmont Avenue.": "Nuestra clínica está ubicada en 7634 West Belmont Avenue, Chicago, IL 60634. Hay estacionamiento cómodo y accesible en la calle directamente frente a la clínica y a lo largo de Belmont Avenue.",
  "Have a question not listed here? Our friendly staff is ready to help.": "¿Tiene alguna pregunta no incluida aquí? Nuestro amable personal está listo para ayudarle.",
