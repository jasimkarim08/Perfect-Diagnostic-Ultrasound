<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 70" width="440" height="70" fill="none">
  <!-- Option 6D: Harmonic Waveform Loop & Precision Coordinate Calipers -->
  <!-- Transducer Probe Integration Left -->
  <g transform="translate(8, 6)">
    <!-- Slanted Transducer Probe Face -->
    <path d="M4 18 C8 14, 14 14, 18 18 L16 46 C12 50, 6 50, 2 46 Z" fill="#02424E"/>
    <circle cx="10" cy="32" r="3" fill="#0A808C"/>
    <!-- Expanding Radiating Waves -->
    <path d="M22 20 A 16 16 0 0 1 22 44" stroke="#0A808C" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M28 14 A 24 24 0 0 1 28 50" stroke="#02424E" stroke-width="2.8" stroke-linecap="round"/>
    <path d="M34 9 A 32 32 0 0 1 34 55" stroke="#5E9297" stroke-width="2.2" stroke-linecap="round"/>
  </g>

  <!-- Typography: PERFECT -->
  <text x="54" y="37" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="900" fill="#02424E" letter-spacing="1.2">PERFECT</text>

  <!-- Dual-Frequency Cardiac Doppler Waveform (Upper Active Line + Soft Harmonic Echo) -->
  <path d="M198 30 L 216 30 L 221 16 L 228 45 L 235 22 L 240 34 L 246 30 L 420 30" stroke="#0A808C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M216 35 L 221 24 L 228 48 L 235 29 L 240 37 L 246 35" stroke="#5E9297" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  
  <!-- Right Pulse Termination Target -->
  <circle cx="424" cy="30" r="4" fill="#02424E"/>
  <circle cx="424" cy="30" r="1.8" fill="#FFFFFF"/>

  <!-- Subtitle: DIAGNOSTIC ULTRASOUND with Coordinate Caliper Crosshairs -->
  <path d="M54 47 L54 59 M50 53 L58 53" stroke="#0A808C" stroke-width="2.2" stroke-linecap="round"/>
  <text x="64" y="57" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="800" fill="#055E6E" letter-spacing="4.8">DIAGNOSTIC ULTRASOUND</text>
  <path d="M424 47 L424 59 M420 53 L428 53" stroke="#0A808C" stroke-width="2.2" stroke-linecap="round"/>
</svg>
