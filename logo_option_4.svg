<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 60" width="360" height="60" fill="none">
  <!-- Precision Acoustic Pulse Mark -->
  <g transform="translate(6, 6)">
    <!-- Modern Shield / Sonar Frame -->
    <rect x="2" y="2" width="44" height="44" rx="12" fill="#02424E"/>
    <!-- Acoustic Rings -->
    <circle cx="24" cy="24" r="16" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="24" cy="24" r="10" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
    <!-- Transducer Cross / EKG Heartbeat -->
    <path d="M12 24 L18 24 L21 16 L25 32 L28 20 L30 24 L36 24" stroke="#0A808C" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Typography: Modern Clinical Hierarchy -->
  <text x="62" y="26" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#02424E" letter-spacing="0.2">Perfect Diagnostic</text>
  
  <!-- Pill Badge Accent for Ultrasound -->
  <rect x="62" y="34" width="128" height="18" rx="4" fill="#EBF4F6"/>
  <text x="70" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#02424E" letter-spacing="2.8">ULTRASOUND</text>
  <text x="198" y="47" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#6F9EA3">Chicago, IL</text>
</svg>