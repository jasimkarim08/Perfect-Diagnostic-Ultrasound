<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 70" width="440" height="70" fill="none">
  <!-- Option 6C: Contrast Foundation Pill with Doppler Pulse -->
  <!-- Transducer Sonar Beam Left Cluster -->
  <g transform="translate(6, 4)">
    <path d="M10 21 A 17 17 0 0 1 10 43" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <path d="M17 14 A 26 26 0 0 1 17 50" stroke="#02424E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M24 8 A 34 34 0 0 1 24 56" stroke="#5E9297" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: PERFECT -->
  <text x="46" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="27" font-weight="900" fill="#02424E" letter-spacing="1.2">PERFECT</text>

  <!-- Upper Waveform Doppler Trace -->
  <path d="M190 27 L 220 27 L 225 15 L 231 40 L 237 21 L 242 31 L 247 27 L 420 27" stroke="#0A808C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="424" cy="27" r="3.5" fill="#0A808C"/>

  <!-- Integrated Teal Contrast Badge for Subtitle -->
  <rect x="46" y="42" width="382" height="20" rx="10" fill="#02424E"/>
  
  <!-- Left & Right Mini Caliper Dots inside Badge -->
  <circle cx="60" cy="52" r="2.5" fill="#0A808C"/>
  <circle cx="414" cy="52" r="2.5" fill="#0A808C"/>

  <text x="237" y="56" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.8" font-weight="800" fill="#FFFFFF" letter-spacing="4.6">DIAGNOSTIC ULTRASOUND</text>
</svg>
