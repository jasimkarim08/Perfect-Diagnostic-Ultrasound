<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 65" width="560" height="65" fill="none">
  <!-- Concept 2: Full-Span Signal Line from Soundwaves Under All Inline Text -->
  <g transform="translate(6, 4)">
    <path d="M8 18 A 16 16 0 0 1 8 38" stroke="#0A808C" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 12 A 24 24 0 0 1 15 44" stroke="#02424E" stroke-width="3.2" stroke-linecap="round"/>
    <path d="M22 6 A 32 32 0 0 1 22 50" stroke="#5E9297" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Inline Typography -->
  <text x="44" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="23" font-weight="900" fill="#02424E" letter-spacing="1.5">PERFECT</text>
  <text x="162" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#0A808C" letter-spacing="2.8">DIAGNOSTIC</text>
  <text x="282" y="34" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="700" fill="#02424E" letter-spacing="2.8">ULTRASOUND</text>

  <!-- Continuous Flat Signal Baseline from x=32 all the way under text, then ECG Pulse -->
  <path d="M 32 44 L 435 44 L 441 28 L 448 57 L 455 34 L 460 48 L 465 44 L 546 44" stroke="#0A808C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="546" cy="44" r="3.2" fill="#02424E"/>
</svg>