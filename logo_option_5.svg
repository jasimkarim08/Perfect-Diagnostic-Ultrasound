  <text x="236" y="56" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="800" fill="#FFFFFF" letter-spacing="3.2">DIAGNOSTIC ULTRASOUND</text>

  <!-- Right Pulse Accent Tick -->
  <circle cx="388" cy="27" r="3.5" fill="#0A808C"/>
</svg>
